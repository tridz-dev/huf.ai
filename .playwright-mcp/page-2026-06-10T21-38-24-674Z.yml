            - text: "#"
        - paragraph [ref=e359]:
          - text: When
          - code [ref=e360]: generate_audio
          - text: runs inside a chat conversation, it creates an
          - code [ref=e361]: Agent Message
          - text: with
          - code [ref=e362]: kind = "Audio"
          - text: . The chat frontend (
          - code [ref=e363]: audio-player.tsx
          - text: ) renders a native audio player for these messages, allowing users to play the generated audio inline.
        - separator [ref=e364]
        - heading "Speech-to-Text (STT)Permalink for this section" [level=2] [ref=e365]:
          - text: Speech-to-Text (STT)
          - link "Permalink for this section" [ref=e366] [cursor=pointer]:
            - /url: "#speech-to-text-stt"
            - text: "#"
        - paragraph [ref=e367]:
          - text: HUF supports speech-to-text transcription via the
          - code [ref=e368]: handle_speech_to_text
          - text: function in
          - code [ref=e369]: transcription_handler.py
          - text: . This is used to transcribe audio uploaded by users in the chat interface.
        - heading "How STT WorksPermalink for this section" [level=3] [ref=e370]:
          - text: How STT Works
          - link "Permalink for this section" [ref=e371] [cursor=pointer]:
            - /url: "#how-stt-works"
            - text: "#"
        - paragraph [ref=e372]:
          - text: STT in HUF is
          - strong [ref=e373]: provider-driven
          - text: ": it dispatches to the"
          - code [ref=e374]: transcribe_audio()
          - text: method on a
          - code [ref=e375]: "*Settings"
          - text: singleton DocType (e.g.,
          - code [ref=e376]: OpenAI Settings
          - text: ","
          - code [ref=e377]: Groq Settings
          - text: "). The flow is:"
        - list [ref=e378]:
          - listitem [ref=e379]:
            - text: User uploads an audio file (e.g.,
            - code [ref=e380]: .webm
            - text: recorded in browser)
          - listitem [ref=e381]:
            - text: Frontend calls
            - code [ref=e382]: handle_speech_to_text
            - text: with the Frappe
