        - heading "How Generated Images Are StoredPermalink for this section" [level=3] [ref=e792]:
          - text: How Generated Images Are Stored
          - link "Permalink for this section" [ref=e793] [cursor=pointer]:
            - /url: "#how-generated-images-are-stored"
            - text: "#"
        - paragraph [ref=e794]: "Each generated image is:"
        - list [ref=e795]:
          - listitem [ref=e796]: Downloaded (URL) or decoded (base64) from the provider response
          - listitem [ref=e797]:
            - text: Saved as a Frappe
            - code [ref=e798]: File
            - text: document (attached to the
            - code [ref=e799]: Agent Message
            - text: )
          - listitem [ref=e800]:
            - text: An
            - code [ref=e801]: Agent Message
            - text: is created with
            - code [ref=e802]: kind = "Image"
            - text: pointing to the file
          - listitem [ref=e803]: The image URL is returned to the agent in the tool response
        - heading "Agent image_generation_model FieldPermalink for this section" [level=3] [ref=e804]:
          - text: Agent
          - code [ref=e805]: image_generation_model
          - text: Field
          - link "Permalink for this section" [ref=e806] [cursor=pointer]:
            - /url: "#agent-image_generation_model-field"
            - text: "#"
        - paragraph [ref=e807]:
          - text: Set this on the
          - strong [ref=e808]: Agent
          - text: "document (Advanced Settings section) to pin the agent to a specific image model:"
        - list [ref=e809]:
          - listitem [ref=e810]:
            - text: Create an
            - strong [ref=e811]: AI Model
            - text: document for your image model (e.g.,
            - code [ref=e812]: dall-e-3
            - text: linked to OpenAI provider)
          - listitem [ref=e813]:
            - text: On the Agent, set
            - strong [ref=e814]: Image Generation Model
            - text: to that AI Model
          - listitem [ref=e815]:
            - text: The agent will use that model for all
            - code [ref=e816]: generate_image
            - text: calls
        - separator [ref=e817]
        - heading "Vision / Image InputPermalink for this section" [level=2] [ref=e818]:
          - text: Vision / Image Input
          - link "Permalink for this section" [ref=e819] [cursor=pointer]:
            - /url: "#vision--image-input"
            - text: "#"
        - paragraph [ref=e820]:
          - text: HUF agents can process images passed as part of conversation messages. Vision is handled natively through LiteLLM’s
          - code [ref=e821]: image_url
          - text: message format — no special tool is needed.
        - heading "Supported Vision ModelsPermalink for this section" [level=3] [ref=e822]:
          - text: Supported Vision Models
          - link "Permalink for this section" [ref=e823] [cursor=pointer]:
            - /url: "#supported-vision-models"
            - text: "#"
        - paragraph [ref=e824]: "Any model that supports vision through LiteLLM works automatically:"
        - list [ref=e825]:
          - listitem [ref=e826]:
            - strong [ref=e827]: "OpenAI:"
            - code [ref=e828]: gpt-4o
            - text: ","
            - code [ref=e829]: gpt-4o-mini
            - text: ","
            - code [ref=e830]: gpt-4-turbo
          - listitem [ref=e831]:
            - strong [ref=e832]: "Anthropic:"
            - code [ref=e833]: claude-3-5-sonnet-20241022
            - text: ","
            - code [ref=e834]: claude-3-opus
            - text: ","
            - code [ref=e835]: claude-3-haiku
          - listitem [ref=e836]:
            - strong [ref=e837]: "Google:"
            - code [ref=e838]: gemini-1.5-pro
            - text: ","
            - code [ref=e839]: gemini-1.5-flash
            - text: ","
            - code [ref=e840]: gemini-2.0-flash
        - heading "How Image Input WorksPermalink for this section" [level=3] [ref=e841]:
          - text: How Image Input Works
          - link "Permalink for this section" [ref=e842] [cursor=pointer]:
            - /url: "#how-image-input-works"
            - text: "#"
        - paragraph [ref=e843]: "When a user uploads an image in the chat, the frontend:"
        - list [ref=e844]:
          - listitem [ref=e845]: Uploads the file to Frappe and gets a file URL
          - listitem [ref=e846]:
            - text: Includes the image in the message content as an
            - code [ref=e847]: image_url
            - text: "object in LiteLLM’s format:"
        - code [ref=e850]:
          - generic [ref=e851]: "{"
          - generic [ref=e852]: "\"role\": \"user\","
          - generic [ref=e853]: "\"content\": ["
          - generic [ref=e854]: "{\"type\": \"text\", \"text\": \"What is in this image?\"},"
          - generic [ref=e855]: "{\"type\": \"image_url\", \"image_url\": {\"url\": \"data:image/jpeg;base64,...\"}}"
          - generic [ref=e856]: "]"
          - generic [ref=e857]: "}"
        - list [ref=e858]:
          - listitem [ref=e859]: The agent’s vision-capable model processes the image and responds
        - heading "File Attachment TriggersPermalink for this section" [level=3] [ref=e860]:
          - text: File Attachment Triggers
          - link "Permalink for this section" [ref=e861] [cursor=pointer]:
            - /url: "#file-attachment-triggers"
            - text: "#"
        - paragraph [ref=e862]:
          - text: The Agent Trigger system supports
          - code [ref=e863]: after_insert
          - text: and other doc events on the
          - code [ref=e864]: File
          - text: DocType. You can configure an agent to automatically process uploaded files using a
          - strong [ref=e865]: Doc Event
          - text: trigger on
          - code [ref=e866]: File
          - text: .
        - separator [ref=e867]
