      - main [ref=e175]:
        - heading "Audio, Voice & Vision" [level=1] [ref=e176]
        - paragraph [ref=e177]: HUF agents can generate speech, transcribe audio, generate images, and accept image inputs — all powered by LiteLLM’s unified provider interface.
        - separator [ref=e178]
        - heading "Text-to-Speech (TTS)Permalink for this section" [level=2] [ref=e179]:
          - text: Text-to-Speech (TTS)
          - link "Permalink for this section" [ref=e180] [cursor=pointer]:
            - /url: "#text-to-speech-tts"
            - text: "#"
        - paragraph [ref=e181]:
          - text: HUF’s TTS capability is surfaced as the
          - code [ref=e182]: generate_audio
          - text: tool (
          - code [ref=e183]: handle_generate_audio
          - text: in
          - code [ref=e184]: sdk_tools.py
          - text: ). When called, the agent converts text to speech, saves the audio file as a Frappe file attachment, and creates an
          - code [ref=e185]: Agent Message
          - text: with
          - code [ref=e186]: kind = "Audio"
          - text: so the chat UI can render an audio player.
        - heading "The generate_audio ToolPermalink for this section" [level=3] [ref=e187]:
          - text: The
