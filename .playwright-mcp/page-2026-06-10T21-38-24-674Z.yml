        - paragraph [ref=e904]:
          - text: Audio messages (
          - code [ref=e905]: kind = "Audio"
          - text: ) created by
          - code [ref=e906]: handle_generate_audio
          - text: are displayed with a native HTML5 audio player in the HUF chat interface. The audio file URL is fetched from the Frappe File attachment linked to the message.
