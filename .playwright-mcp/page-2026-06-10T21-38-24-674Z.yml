        - heading "Cross-Provider TTS ConfigurationPermalink for this section" [level=3] [ref=e296]:
          - text: Cross-Provider TTS Configuration
          - link "Permalink for this section" [ref=e297] [cursor=pointer]:
            - /url: "#cross-provider-tts-configuration"
            - text: "#"
        - paragraph [ref=e298]: "You can run the main agent on one provider (e.g., Anthropic Claude for reasoning) and use a completely different provider for TTS (e.g., ElevenLabs for high-quality voice):"
        - list [ref=e299]:
          - listitem [ref=e300]:
            - text: Create an
            - strong [ref=e301]: AI Provider
            - text: document for ElevenLabs with its API key
          - listitem [ref=e302]:
            - text: Create an
            - strong [ref=e303]: AI Model
            - text: document (e.g.,
            - code [ref=e304]: eleven_multilingual_v2
            - text: ) linked to that provider
          - listitem [ref=e305]:
            - text: On your Agent document, set
            - strong [ref=e306]: TTS Model
            - text: to that AI Model document
          - listitem [ref=e307]:
            - text: Set
            - strong [ref=e308]: TTS Voice
            - text: to your preferred ElevenLabs voice ID
        - paragraph [ref=e309]:
          - text: The
          - code [ref=e310]: generate_audio
          - text: tool will automatically use the ElevenLabs API key, regardless of the agent’s main provider.
        - heading "Agent DocType TTS FieldsPermalink for this section" [level=3] [ref=e311]:
